<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>チワワでワン撃 🐕</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./core.js"></script>
<script src="./ai.js"></script>
<style>
  :root { --bg:#2a1c14; --panel:#3d2a1e; --accent:#e8a04a; --ink:#fbeede; --good:#7ecb6b; --bad:#e56b6b; --face:#c98a4b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,"Segoe UI",sans-serif; }
  #root { min-height:100dvh; }
  .wrap { max-width:520px; margin:0 auto; padding:12px; }
  h1 { font-size:26px; text-align:center; margin:10px 0; }
  .sub { text-align:center; opacity:.8; font-size:13px; margin-bottom:14px; }
  button { font-family:inherit; font-size:15px; border:none; border-radius:10px;
    padding:11px 14px; background:var(--accent); color:#2a1c14; font-weight:700;
    cursor:pointer; margin:4px 2px; }
  button.ghost { background:#5a4433; color:var(--ink); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .card { display:inline-flex; align-items:center; justify-content:center;
    width:46px; height:64px; border-radius:8px; margin:3px; font-weight:800; font-size:20px;
    background:var(--face); color:#3a2410; box-shadow:0 2px 0 #7a5528; }
  .card.back { background:#5b3f2b; color:#c98a4b; font-size:22px; }
  .card.sp { background:#b56ad0; color:#fff; font-size:13px; width:56px; }
  .card.hl { outline:3px solid var(--good); }
  .rc { position:relative; border:2px solid #7a5528; }
  .ob { position:absolute; top:-7px; left:-3px; font-size:9px; line-height:1;
    padding:2px 4px; border-radius:6px; color:#12100a; font-weight:800; white-space:nowrap; }
  .rcv { font-size:20px; font-weight:800; color:#3a2410; }
  .rcq { font-size:20px; color:#c98a4b; }
  .rcown { box-shadow:0 0 0 2px var(--ink) inset; }
  .card.dim { opacity:.5; }
  .panel { background:var(--panel); border-radius:12px; padding:10px; margin:8px 0; }
  .row-cards { display:flex; flex-wrap:wrap; gap:2px; min-height:70px; }
  .hand { display:flex; flex-wrap:wrap; }
  .players { display:flex; gap:6px; flex-wrap:wrap; }
  .pchip { background:#4a3323; border-radius:9px; padding:6px 9px; font-size:12px; flex:1 1 40%; }
  .pchip.cur { outline:2px solid var(--accent); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:10; }
  .sheet { background:var(--panel); border-radius:16px; padding:18px; max-width:480px; width:100%; }
  .num-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:10px 0; }
  .num-grid button { padding:12px 0; margin:0; }
  .tag { font-size:11px; background:#5a4433; padding:2px 6px; border-radius:6px; }
  .log { font-size:12px; opacity:.85; max-height:96px; overflow:auto; margin-top:6px; }
  .center { text-align:center; }
  .big { font-size:34px; }
  .breakdown { font-size:13px; line-height:1.6; }
  .win { color:var(--good); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/jsx" id="appsrc">
const { useState, useEffect, useRef } = React;
const GC = window.GameCore;
const AI = window.GameAI;
const SP_LABEL = { amaenbo: "甘えん坊", yancha: "やんちゃ", ohirune: "お昼寝" };
const PCOLORS = ["#e8a04a", "#7ecb6b", "#6aa0e0", "#d07ad0"];
function ownerBadge(placedBy, names, cpuFlags) {
  const nm = names[placedBy] || ("P" + (placedBy + 1));
  return (cpuFlags && cpuFlags[placedBy] ? "🤖" : "") + nm;
}

// 場の1枚（配置者バッジ常時表示・自分の置いたカードは値表示）
function RowCard({ vc, names, cpuFlags, viewer }) {
  const col = PCOLORS[vc.placedBy % PCOLORS.length];
  const mine = vc.placedBy === viewer;
  return <div className={"card rc" + (mine ? " rcown" : "")} style={{ borderColor: col }}>
    <span className="ob" style={{ background: col }}>{ownerBadge(vc.placedBy, names, cpuFlags)}</span>
    {vc.v != null ? <span className="rcv">{vc.v}</span> : <span className="rcq">🐕</span>}
  </div>;
}

// history エントリ → 表示テキスト（公開情報のみ）
function histText(h, names, cpuFlags) {
  const nm = (i) => (cpuFlags && cpuFlags[i] ? "🤖" : "") + (names[i] || ("P" + (i + 1)));
  if (h.type === "play") return nm(h.player) + " が " + (h.pos + 1) + "番目に置いた";
  if (h.type === "move") return nm(h.player) + " が " + (h.from + 1) + "番目→" + (h.to + 1) + "番目へ移動";
  if (h.type === "reveal") {
    const r = h.result;
    return "公開(" + nm(h.revealer) + "): [" + h.rowCards.map((c) => c.v).join(",") +
      "] n=" + r.n + " " + r.total + "点" + (r.wangeki ? " ワン撃!" : "");
  }
  return "";
}

function evToText(e) {
  switch (e.type) {
    case "played": return "P" + (e.player + 1) + " が場に伏せた";
    case "moved": return "P" + (e.player + 1) + " が場札を移動 (🪙" + e.tokensLeft + ")";
    case "forcedReveal": return "12枚→P" + (e.player + 1) + " 強制公開！";
    case "revealed": return "公開: [" + e.row.join(",") + "]";
    case "score": { var pn = (e.revealer !== undefined ? e.revealer : e.player) + 1; return "P" + pn + " " + (e.delta >= 0 ? "+" : "") + e.delta + "点"; }
    case "wan": return "P" + (e.player + 1) + " ワン！" + (e.delta > 0 ? "+" : "") + e.delta;
    case "specialUsed": return "特殊: " + (SP_LABEL[e.special] || e.special);
    case "gameover": return "🏆 " + (e.winner === "draw" ? "引き分け" : "P" + (e.winner + 1) + "勝利") + " (" + e.reason + ")";
    case "error": return "⚠ " + e.message;
    default: return "";
  }
}

function seedFromTime() {
  // 決定論を壊さないが対局ごとに変わる seed（起動時1回・以後は固定）
  let s = 0;
  const str = String(Date.now()) + Math.floor(Math.random() * 1e9);
  for (let i = 0; i < str.length; i++) s = (s * 31 + str.charCodeAt(i)) >>> 0;
  return s || 1;
}

function loadStats() {
  try { return JSON.parse(localStorage.getItem("cw_stats") || "{}"); }
  catch (e) { return {}; }
}
function saveStats(st) {
  try { localStorage.setItem("cw_stats", JSON.stringify(st)); } catch (e) {}
}

function Card({ c, faceUp, hl, dim, onClick }) {
  if (!c) return null;
  if (c.t === "special") {
    return <div className={"card sp" + (dim ? " dim" : "")} onClick={onClick}>{SP_LABEL[c.s]}</div>;
  }
  if (!faceUp) return <div className={"card back" + (hl ? " hl" : "")} onClick={onClick}>🐕</div>;
  return <div className={"card" + (hl ? " hl" : "") + (dim ? " dim" : "")} onClick={onClick}>{c.v}</div>;
}

// 宣言収集モーダル（ワン！宣言フェーズ・全員が順に宣言/スキップ）
function DeclareFlow({ state, names, cpuFlags, difficulty, onDone }) {
  const [idx, setIdx] = useState(0);
  const [decls, setDecls] = useState([]);
  const n = state.playerCount;

  useEffect(() => {
    if (idx >= n) { onDone(decls); return; }
    if (cpuFlags[idx]) {
      // CPU自動宣言（viewFor経由の推論のみ・真値カンニングなし）
      const d = AI.chooseDeclaration(GC.viewFor(state, idx), idx, difficulty);
      const nd = d ? decls.concat([d]) : decls;
      const tmr = setTimeout(() => { setDecls(nd); setIdx(idx + 1); }, 350);
      return () => clearTimeout(tmr);
    }
  }, [idx]);

  if (idx >= n) return null;
  if (cpuFlags[idx]) {
    return <div className="modal"><div className="sheet center">
      <div>{names[idx]}（CPU）が思考中…🐕</div></div></div>;
  }
  const pick = (v) => { setDecls(v === null ? decls : decls.concat([{ player: idx, value: v }])); setIdx(idx + 1); };
  return <div className="modal"><div className="sheet">
    <div className="center"><b>{names[idx]}</b> のワン！宣言</div>
    <div className="sub">連番が何まで続くか予想（当たれば+5 / 外れれば-5）。カードはまだ裏向き。</div>
    <div className="num-grid">
      {Array.from({ length: 12 }, (_, i) => i + 1).map((v) =>
        <button key={v} onClick={() => pick(v)}>{v}</button>)}
    </div>
    <div className="center"><button className="ghost" onClick={() => pick(null)}>宣言しない</button></div>
  </div></div>;
}

// 特殊カード選択（公開者のみ・場を表向きで見て選ぶ。甘えん坊は欠け数字も選択）
function SpecialFlow({ state, revealer, specials, names, onDone }) {
  const [amaePick, setAmaePick] = useState(false);
  const rowVals = state.row.map((c) => c.v);
  const has = (name) => specials.some((c) => c.s === name);
  const base = GC.scoreRow(state.row);
  const preview = (sp) => GC.scoreRow(state.row, sp).total;

  if (amaePick) {
    return <div className="modal"><div className="sheet">
      <div className="center"><b>甘えん坊</b>: 補完する欠け数字を選択</div>
      <div className="row-cards center" style={{ justifyContent: "center", margin: "6px 0" }}>
        {rowVals.map((v, i) => <div key={i} className="card">{v}</div>)}
      </div>
      <div className="num-grid">
        {Array.from({ length: 12 }, (_, i) => i + 1).map((v) =>
          <button key={v} onClick={() => onDone({ type: "amaenbo", number: v })}>
            {v}<br /><span style={{ fontSize: 10 }}>{preview({ type: "amaenbo", number: v })}点</span>
          </button>)}
      </div>
      <div className="center"><button className="ghost" onClick={() => setAmaePick(false)}>戻る</button></div>
    </div></div>;
  }

  return <div className="modal"><div className="sheet">
    <div className="center"><b>{names[revealer]}</b> の特殊カード（任意・最大1枚）</div>
    <div className="row-cards center" style={{ justifyContent: "center", margin: "8px 0" }}>
      {rowVals.map((v, i) => <div key={i} className="card">{v}</div>)}
    </div>
    <div className="sub center">現在の得点: {base.total}点（n={base.n} / ペナ-{base.penalty}）</div>
    <div className="center">
      {has("ohirune") && <button onClick={() => onDone({ type: "ohirune" })}>お昼寝<br /><span style={{ fontSize: 10 }}>{preview({ type: "ohirune" })}点</span></button>}
      {has("yancha") && <button onClick={() => onDone({ type: "yancha" })}>やんちゃ<br /><span style={{ fontSize: 10 }}>{preview({ type: "yancha" })}点</span></button>}
      {has("amaenbo") && <button onClick={() => setAmaePick(true)}>甘えん坊…</button>}
    </div>
    <div className="center" style={{ marginTop: 8 }}><button className="ghost" onClick={() => onDone(null)}>特殊を使わない</button></div>
  </div></div>;
}

// ============================================================================
// OnlineGame — 🌐オンライン対戦（Django Channels 権威サーバーと WebSocket 通信）
// サーバーの view(view_for) メッセージ駆動で盤面を描画。ローカルcore.jsは呼ばない。
// ============================================================================
function wsBase() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const host = location.host || "localhost:8000";
  return proto + "://" + host + "/ws/room/";
}
function OnlineGame({ onExit }) {
  const [phase, setPhase] = useState("setup"); // setup|lobby|game
  const [server, setServer] = useState(wsBase());
  const [name, setName] = useState("");
  const [joinCode, setJoinCode] = useState("");
  const [room, setRoom] = useState(null); // {code, seat, token}
  const [lobby, setLobby] = useState(null);
  const [view, setView] = useState(null);
  const [gamePhase, setGamePhase] = useState("play");
  const [wan, setWan] = useState(null); // {revealer, deadline, responded}
  const [wanDone, setWanDone] = useState(false);
  const [special, setSpecial] = useState(null); // {revealer, deadline, rowCards}
  const [reveal, setReveal] = useState(null);
  const [toast, setToast] = useState("");
  const [now, setNow] = useState(Date.now());
  const wsRef = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(t);
  }, []);

  function saved() { try { return JSON.parse(localStorage.getItem("cw_online") || "null"); } catch (e) { return null; } }
  function save(o) { try { localStorage.setItem("cw_online", JSON.stringify(o)); } catch (e) {} }

  function connect(code, token, after) {
    const url = server + code + "/" + (token ? "?token=" + encodeURIComponent(token) : "");
    let ws;
    try { ws = new WebSocket(url); } catch (e) { setToast("接続失敗: " + e.message); return; }
    wsRef.current = ws;
    ws.onopen = () => { if (after) after(ws); };
    ws.onclose = () => { setToast("切断されました"); };
    ws.onerror = () => { setToast("WS接続エラー（サーバー起動/URL確認）"); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      handle(m);
    };
  }
  function send(obj) { const ws = wsRef.current; if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function handle(m) {
    switch (m.type) {
      case "created":
      case "joined": {
        const r = { code: m.code, seat: m.seat, token: m.token };
        setRoom(r); save({ code: m.code, token: m.token }); setPhase("lobby"); break;
      }
      case "room_state": setLobby(m); if (phase === "setup") setPhase("lobby"); break;
      case "started": setPhase("game"); setGamePhase("play"); break;
      case "view": setView(m.view); setGamePhase(m.phase);
        if (m.phase === "play") { setWan(null); setSpecial(null); setWanDone(false); } break;
      case "wan_phase": setWan({ revealer: m.revealer, deadline: m.deadline, responded: [] }); setWanDone(false); setSpecial(null); setPhase("game"); break;
      case "wan_progress": setWan((w) => w ? { ...w, responded: m.responded, total: m.total } : w); break;
      case "special_phase": setSpecial({ revealer: m.revealer, deadline: m.deadline, rowCards: m.rowCards }); setWan(null); break;
      case "reveal_result": setReveal(m); setWan(null); setSpecial(null); break;
      case "gameover": setToast(m.reason === "abandoned" ? "流局（人数不足）" : "ゲーム終了"); break;
      case "player_disconnected": setToast("席" + (m.seat + 1) + " 切断（" + m.graceSec + "秒以内に復帰可）"); break;
      case "player_reconnected": setToast("席" + (m.seat + 1) + " 復帰"); break;
      case "error": setToast("⚠ " + (m.message || m.code)); break;
      default: break;
    }
  }

  function doCreate() { connect("AAAAA", null, (ws) => ws.send(JSON.stringify({ type: "create_room", name: name || "P1" }))); }
  function doJoin() {
    const code = (joinCode || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
    if (code.length !== 5) { setToast("5文字のコードを入力"); return; }
    connect(code, null, (ws) => ws.send(JSON.stringify({ type: "join", name: name || "P" })));
  }
  function doReconnect() {
    const s = saved(); if (!s) return;
    connect(s.code, s.token, () => { setRoom({ code: s.code, token: s.token }); });
  }
  const secLeft = (dl) => Math.max(0, Math.ceil((dl - now) / 1000));

  // ---- 画面 ----
  if (phase === "setup") {
    const s = saved();
    return <div className="wrap">
      <h1>🌐 オンライン対戦</h1>
      <div className="panel">
        <div className="sub">サーバーURL（daphne起動時は既定でOK）</div>
        <input value={server} onChange={(e) => setServer(e.target.value)} style={inpStyle} />
        <div className="sub" style={{ marginTop: 8 }}>あなたの名前</div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="P1" style={inpStyle} />
        <div className="center" style={{ marginTop: 12 }}>
          <button onClick={doCreate}>ルーム作成</button>
        </div>
        <div className="center" style={{ marginTop: 10 }}>
          <input value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="コード5文字" style={{ ...inpStyle, width: 130, display: "inline-block" }} />
          <button className="ghost" onClick={doJoin}>コードで参加</button>
        </div>
        {s && <div className="center" style={{ marginTop: 10 }}><button className="ghost" onClick={doReconnect}>前回の部屋に再接続（{s.code}）</button></div>}
      </div>
      <div className="center"><button className="ghost" onClick={onExit}>← 戻る</button></div>
      {toast && <div className="panel center" style={{ color: "var(--accent)" }}>{toast}</div>}
    </div>;
  }

  if (phase === "lobby") {
    const isHost = lobby && lobby.hostSeat === (room && room.seat);
    return <div className="wrap">
      <h1>ロビー 🐕</h1>
      <div className="panel center">
        <div className="big">コード: <b>{lobby ? lobby.code : (room && room.code)}</b></div>
        <div className="sub">この5文字を相手に伝えて参加してもらう</div>
      </div>
      <div className="panel">
        <b>参加者</b>
        {lobby && lobby.players.map((p) => <div key={p.seat}>
          {p.isHost ? "👑" : "・"}{p.name} {p.connected ? "" : "（切断中）"} {p.seat === (room && room.seat) ? "← あなた" : ""}
        </div>)}
      </div>
      {isHost ? <div className="center"><button disabled={!lobby || lobby.players.length < 2} onClick={() => send({ type: "start" })}>ゲーム開始（{lobby ? lobby.players.length : 0}人）</button></div>
        : <div className="sub center">ホストの開始を待っています…</div>}
      <div className="center"><button className="ghost" onClick={onExit}>← 退出</button></div>
      {toast && <div className="panel center" style={{ color: "var(--accent)" }}>{toast}</div>}
    </div>;
  }

  // --- ゲーム画面（サーバーview駆動） ---
  if (!view) return <div className="wrap center">接続中… {toast}</div>;
  const mySeat = room ? room.seat : view.viewer;
  const names = view.players.map((p) => "P" + (p.index + 1));
  const cpuFlags = view.players.map(() => false);
  const myTurn = view.current === mySeat && gamePhase === "play" && !view.finished;
  const myHand = (view.players[mySeat] && view.players[mySeat].hand) || [];
  const iAmRevealer = special && special.revealer === mySeat;

  return <div className="wrap">
    <div className="players">
      {view.players.map((p, i) => <div key={i} className={"pchip" + (i === view.current ? " cur" : "")}
        style={{ boxShadow: "inset 0 -3px 0 " + PCOLORS[i % PCOLORS.length] }}>
        <b>{names[i]}</b> {p.score}点{i === mySeat ? "（あなた）" : ""}<br />
        <span className="tag">🪙{p.tokens}</span> <span className="tag">手{p.handCount}</span>
      </div>)}
    </div>
    <div className="panel">
      <div style={{ fontSize: 12, opacity: .8 }}>場（{view.row.length}/12）山{view.deckCount}/捨{view.discardCount}</div>
      <div className="row-cards">
        {view.row.map((vc) => <RowCard key={vc.id} vc={vc} names={names} cpuFlags={cpuFlags} viewer={mySeat} />)}
        {view.row.length === 0 && <span style={{ opacity: .5, fontSize: 13 }}>まだ場札なし</span>}
      </div>
      <div className="sub">値が見えるのは自分が置いたカードだけ</div>
    </div>
    <div className="panel">
      <div style={{ fontSize: 12, opacity: .8 }}>あなたの手札</div>
      <div className="hand">
        {myHand.map((c, i) => <Card key={i} c={c} faceUp={true} dim={!myTurn || c.t === "special"}
          onClick={myTurn && c.t === "butt" ? () => send({ type: "action", action: { type: "play", cardIndex: i } }) : undefined} />)}
      </div>
      {myTurn ? <div>
        <button onClick={() => send({ type: "action", action: { type: "reveal" } })}>公開する</button>
        <button className="ghost" disabled={view.players[mySeat].tokens <= 0 || view.row.length < 1}
          onClick={() => { const f = prompt("移動元(1〜" + view.row.length + ")"); if (!f) return; const t = prompt("移動先(1〜" + view.row.length + ")"); if (!t) return; send({ type: "action", action: { type: "move", from: (+f) - 1, to: (+t) - 1 } }); }}>移動（🪙-1）</button>
      </div> : <div className="sub">{view.finished ? "ゲーム終了" : "P" + (view.current + 1) + " の手番…"}</div>}
    </div>

    {wan && !wanDone && <div className="modal"><div className="sheet">
      <div className="center"><b>ワン！同時宣言</b>（残り{secLeft(wan.deadline)}秒）</div>
      <div className="sub center">連番が何まで続くか予想。他者の宣言は締切まで非公開。回答済み: {(wan.responded || []).length}人</div>
      <div className="num-grid">
        {Array.from({ length: 12 }, (_, i) => i + 1).map((v) => <button key={v} onClick={() => { send({ type: "wan_declare", value: v }); setWanDone(true); }}>{v}</button>)}
      </div>
      <div className="center"><button className="ghost" onClick={() => { send({ type: "wan_declare", value: null }); setWanDone(true); }}>宣言しない</button></div>
    </div></div>}
    {wan && wanDone && <div className="modal"><div className="sheet center">宣言しました。他プレイヤーを待っています…（残り{secLeft(wan.deadline)}秒）</div></div>}

    {special && (iAmRevealer
      ? <OnlineSpecial special={special} onDone={(sp) => { send({ type: "special", card: sp ? sp.type : null, number: sp ? sp.number : undefined }); setSpecial(null); }} secLeft={secLeft} />
      : <div className="modal"><div className="sheet center">公開者が特殊カードを選択中…（残り{secLeft(special.deadline)}秒）</div></div>)}

    {reveal && <RevealModal reveal={{ result: reveal.result, rowCards: reveal.rowCards, revealer: reveal.revealer, wans: (reveal.wans || []).map((w) => ({ player: w.seat, delta: w.delta })), forced: reveal.forced }} names={names} cpuFlags={cpuFlags} onClose={() => setReveal(null)} />}

    {view.finished && <div className="panel center"><b>🏆 {view.winner === "draw" ? "引き分け" : "P" + (view.winner + 1) + " の勝ち！"}</b><br /><button className="ghost" onClick={onExit}>タイトルへ</button></div>}
    <div className="panel">
      <div style={{ fontSize: 13 }}>📜 履歴（{view.history.length}）</div>
      <div className="log">{view.history.slice().reverse().slice(0, 12).map((h, i) => <div key={i}>{histText(h, names, cpuFlags)}</div>)}</div>
    </div>
    {toast && <div className="panel center" style={{ color: "var(--accent)", fontSize: 12 }}>{toast}</div>}
  </div>;
}
const inpStyle = { width: "100%", padding: "9px", borderRadius: "8px", border: "1px solid #5a4433", background: "#2a1c14", color: "var(--ink)", fontSize: 14 };

function OnlineSpecial({ special, onDone, secLeft }) {
  const [amae, setAmae] = useState(false);
  const rowVals = special.rowCards.map((c) => c.v);
  const base = GC.scoreRow(rowVals);
  const pv = (sp) => GC.scoreRow(rowVals, sp).total;
  if (amae) return <div className="modal"><div className="sheet">
    <div className="center"><b>甘えん坊</b>: 欠け数字を選択（残り{secLeft(special.deadline)}秒）</div>
    <div className="num-grid">{Array.from({ length: 12 }, (_, i) => i + 1).map((v) => <button key={v} onClick={() => onDone({ type: "amaenbo", number: v })}>{v}<br /><span style={{ fontSize: 10 }}>{pv({ type: "amaenbo", number: v })}</span></button>)}</div>
    <div className="center"><button className="ghost" onClick={() => setAmae(false)}>戻る</button></div>
  </div></div>;
  return <div className="modal"><div className="sheet">
    <div className="center"><b>特殊カード</b>（任意・残り{secLeft(special.deadline)}秒）</div>
    <div className="row-cards center" style={{ justifyContent: "center", margin: "8px 0" }}>{special.rowCards.map((c, i) => <div key={i} className="card">{c.v}</div>)}</div>
    <div className="sub center">現在 {base.total}点（n={base.n}）</div>
    <div className="center">
      <button onClick={() => onDone({ type: "ohirune" })}>お昼寝<br /><span style={{ fontSize: 10 }}>{pv({ type: "ohirune" })}</span></button>
      <button onClick={() => onDone({ type: "yancha" })}>やんちゃ<br /><span style={{ fontSize: 10 }}>{pv({ type: "yancha" })}</span></button>
      <button onClick={() => setAmae(true)}>甘えん坊…</button>
    </div>
    <div className="center" style={{ marginTop: 8 }}><button className="ghost" onClick={() => onDone(null)}>使わない</button></div>
  </div></div>;
}

function App() {
  const [screen, setScreen] = useState("title");
  const [cfg, setCfg] = useState({ mode: "cpu", players: 2, cpu: 1, difficulty: "normal" });
  const [state, setState] = useState(null);
  const [names, setNames] = useState([]);
  const [cpuFlags, setCpuFlags] = useState([]);
  const [log, setLog] = useState([]);
  const [reveal, setReveal] = useState(null); // 進行中の公開情報
  const [declaring, setDeclaring] = useState(null); // ワン！宣言フェーズ
  const [specialing, setSpecialing] = useState(null); // 公開者の特殊カード選択フェーズ
  const [passGate, setPassGate] = useState(false); // ホットシートのパス画面
  const [logOpen, setLogOpen] = useState(true); // アクション履歴の開閉
  const seedRef = useRef(1);
  const stats = useRef(loadStats());

  function pushLog(events) {
    const lines = events.map(evToText).filter(Boolean);
    if (lines.length) setLog((L) => lines.concat(L).slice(0, 40));
  }

  function startGame() {
    const seed = seedFromTime();
    seedRef.current = seed;
    const total = cfg.mode === "cpu" ? 1 + cfg.cpu : cfg.players;
    const st = GC.newGame(seed, total);
    const nm = [], cf = [];
    for (let i = 0; i < total; i++) {
      if (cfg.mode === "cpu") { nm.push(i === 0 ? "あなた" : "CPU" + i); cf.push(i !== 0); }
      else { nm.push("P" + (i + 1)); cf.push(false); }
    }
    setNames(nm); setCpuFlags(cf);
    setState(st); setLog([]); setReveal(null); setDeclaring(null); setSpecialing(null);
    setScreen("game");
  }

  // CPU手番の自動進行
  useEffect(() => {
    if (screen !== "game" || !state || state.finished) return;
    if (declaring || reveal || specialing) return;
    if (!cpuFlags[state.current]) return;
    const tmr = setTimeout(() => {
      const ai = state.current;
      const act = AI.chooseAction(GC.viewFor(state, ai), ai, cfg.difficulty, seedRef.current, GC.legalActions(state));
      doAction(act);
    }, 620);
    return () => clearTimeout(tmr);
  }, [screen, state, declaring, reveal, specialing, cpuFlags]);

  function applyAndSet(action) {
    const res = GC.applyAction(state, action);
    pushLog(res.events);
    // v0.2.0: 記憶モデル廃止。AIは viewFor 経由の推論のみ（updateMemory不要）
    const revealed = res.events.find((e) => e.type === "revealed");
    if (revealed) {
      const sc = res.events.find((e) => e.type === "score");
      const wans = res.events.filter((e) => e.type === "wan");
      setReveal({ result: sc ? sc.detail : null, row: revealed.row, rowCards: revealed.rowCards, revealer: revealed.revealer, wans, forced: revealed.forced });
    }
    setState(res.state);
    if (res.state.finished) setScreen("gameover");
    // ホットシート: 次が人間なら パス画面
    if (cfg.mode === "hotseat" && !res.state.finished && !revealed) setPassGate(true);
  }

  // アクション実行の入口（公開は宣言フローを挟む）
  function doAction(action) {
    if (!state) return;
    const willBeReveal = action.type === "reveal";
    const willBe12th = action.type === "play" && state.row.length === 11 &&
      state.players[state.current].hand[action.cardIndex] &&
      state.players[state.current].hand[action.cardIndex].t === "butt";
    if (willBeReveal || willBe12th) {
      const revealer = state.current;
      // 強制公開(12枚目)は applyAction 前で state.row が11枚のまま。特殊選択/プレビューは
      // 「実際に採点される場」＝12枚目込みで判断すべきなので仮想 row を組む。
      // 強制公開(12枚目)は applyAction 前で state.row が11枚。宣言/特殊選択の推論・プレビューは
      // 「実際に採点される12枚目込みの場」で行うため仮想 revealState を組む。12枚目には placedBy を
      // 付与し、公開者(=配置者)は自札の値を viewFor で見られる（AI過小評価を防止・他者は値null）。
      let revealState = state;
      if (willBe12th) {
        revealState = JSON.parse(JSON.stringify(state));
        const pc = state.players[revealer].hand[action.cardIndex];
        revealState.row.push({ t: "butt", v: pc.v, placedBy: revealer, id: revealState.cardSeq++, faceDown: true });
      }
      // ワン！宣言フェーズ（全員・裏向き） → 特殊カードフェーズ（公開者・表向き見て選択）
      setDeclaring({
        declState: revealState,
        onDone: (decls) => {
          setDeclaring(null);
          if (cpuFlags[revealer]) {
            // CPU: 公開後=表向きの確定row値とhandで最善の特殊を選択（強制公開でも一貫）
            const rowVals = revealState.row.map((c) => c.v);
            const sp = AI.chooseSpecial(rowVals, revealState.players[revealer].hand, cfg.difficulty);
            applyAndSet(Object.assign({}, action, { declarations: decls, special: sp }));
            return;
          }
          const specials = state.players[revealer].hand.filter((c) => c.t === "special");
          if (specials.length === 0) {
            applyAndSet(Object.assign({}, action, { declarations: decls, special: null }));
            return;
          }
          // 人間公開者: 特殊カード選択UIへ（採点対象の場を見て決める）
          setSpecialing({
            state: revealState, revealer, decls, action, specials,
            onDone: (special) => {
              setSpecialing(null);
              applyAndSet(Object.assign({}, action, { declarations: decls, special }));
            },
          });
        },
      });
      return;
    }
    applyAndSet(action);
  }

  function humanPlay(cardIndex) { doAction({ type: "play", cardIndex }); }
  function humanReveal() { doAction({ type: "reveal" }); }
  function humanMove() {
    const from = prompt("移動する場札の位置 (1〜" + state.row.length + ")");
    if (from === null) return;
    const to = prompt("挿入先の位置 (1〜" + state.row.length + ")");
    if (to === null) return;
    doAction({ type: "move", from: (parseInt(from, 10) || 1) - 1, to: (parseInt(to, 10) || 1) - 1 });
  }

  // --- 画面 ---
  if (screen === "online") {
    return <OnlineGame onExit={() => setScreen("title")} />;
  }
  if (screen === "title") {
    return <div className="wrap">
      <h1>チワワでワン撃 🐕</h1>
      <div className="sub">記憶とブラフの連番構築カードゲーム</div>
      <div className="center" style={{ marginBottom: 8 }}>
        <button style={{ fontSize: 16 }} onClick={() => setScreen("online")}>🌐 オンライン対戦</button>
      </div>
      <div className="panel">
        <div className="center"><b>ローカル対戦モード</b></div>
        <div className="center">
          <button className={cfg.mode === "cpu" ? "" : "ghost"} onClick={() => setCfg({ ...cfg, mode: "cpu" })}>CPU対戦</button>
          <button className={cfg.mode === "hotseat" ? "" : "ghost"} onClick={() => setCfg({ ...cfg, mode: "hotseat" })}>ホットシート</button>
        </div>
        {cfg.mode === "cpu" ? <div className="center" style={{ marginTop: 10 }}>
          <div>CPU人数</div>
          {[1, 2, 3].map((k) => <button key={k} className={cfg.cpu === k ? "" : "ghost"} onClick={() => setCfg({ ...cfg, cpu: k })}>{k}体</button>)}
          <div style={{ marginTop: 8 }}>難易度</div>
          {["easy", "normal", "hard"].map((d) => <button key={d} className={cfg.difficulty === d ? "" : "ghost"} onClick={() => setCfg({ ...cfg, difficulty: d })}>{d}</button>)}
        </div> : <div className="center" style={{ marginTop: 10 }}>
          <div>人数</div>
          {[2, 3, 4].map((k) => <button key={k} className={cfg.players === k ? "" : "ghost"} onClick={() => setCfg({ ...cfg, players: k })}>{k}人</button>)}
        </div>}
      </div>
      <div className="center"><button style={{ fontSize: 18, padding: "14px 28px" }} onClick={startGame}>ゲーム開始 🐾</button></div>
      <div className="panel center" style={{ fontSize: 12 }}>
        通算: {(stats.current.games || 0)}戦 / あなた{(stats.current.wins || 0)}勝
      </div>
      <RulesShort />
    </div>;
  }

  if (!state) return <div className="wrap">…</div>;
  const me = state.current;

  if (screen === "gameover") {
    const w = state.winner;
    // 戦績保存
    return <div className="wrap center">
      <h1>{w === "draw" ? "引き分け" : names[w] + " の勝ち！"} 🏆</h1>
      <div className="panel">
        {state.players.map((p, i) => <div key={i} className={i === w ? "win" : ""}>{names[i]}: {p.score}点</div>)}
      </div>
      <button onClick={() => { recordResult(w); setScreen("title"); }}>タイトルへ</button>
    </div>;
  }

  function recordResult(w) {
    const s = stats.current;
    s.games = (s.games || 0) + 1;
    if (cfg.mode === "cpu" && w === 0) s.wins = (s.wins || 0) + 1;
    saveStats(s); stats.current = s;
  }

  // ホットシートのパス画面
  if (passGate && cfg.mode === "hotseat" && !cpuFlags[me]) {
    return <div className="modal"><div className="sheet center">
      <div className="big">🐕</div>
      <div><b>{names[me]}</b> の番です</div>
      <div className="sub">他の人は画面を見ないでね</div>
      <button onClick={() => setPassGate(false)}>手札を見る</button>
    </div></div>;
  }

  // viewer=情報を見てよい主体。CPU対戦は常に人間(0)／ホットシートは手番プレイヤー。
  const viewer = cfg.mode === "cpu" ? 0 : state.current;
  const view = GC.viewFor(state, viewer);
  const humanTurn = !cpuFlags[me] && !state.finished && viewer === me;
  const myHand = view.players[viewer].hand || [];

  return <div className="wrap">
    <div className="players">
      {view.players.map((p, i) =>
        <div key={i} className={"pchip" + (i === me ? " cur" : "")}
          style={{ boxShadow: "inset 0 -3px 0 " + PCOLORS[i % PCOLORS.length] }}>
          <b>{cpuFlags[i] ? "🤖" : ""}{names[i]}</b> {p.score}点<br />
          <span className="tag">🪙{p.tokens}</span> <span className="tag">手{p.handCount}</span>
        </div>)}
    </div>

    <div className="panel">
      <div style={{ fontSize: 12, opacity: .8 }}>場（{view.row.length}/12）　山{view.deckCount} / 捨{view.discardCount}</div>
      <div className="row-cards">
        {view.row.map((vc, i) => <RowCard key={vc.id} vc={vc} names={names} cpuFlags={cpuFlags} viewer={viewer} />)}
        {view.row.length === 0 && <span style={{ opacity: .5, fontSize: 13 }}>まだ場札なし</span>}
      </div>
      <div className="sub">🔲枠の色＝配置者。値が見えるのは<b>自分が置いたカード</b>だけ（移動されても見え続ける）</div>
    </div>

    <div className="panel">
      <div style={{ fontSize: 12, opacity: .8 }}>{names[viewer]} の手札</div>
      <div className="hand">
        {myHand.map((c, i) =>
          <Card key={i} c={c} faceUp={true}
            dim={!humanTurn || c.t === "special"}
            onClick={humanTurn && c.t === "butt" ? () => humanPlay(i) : undefined} />)}
      </div>
      {humanTurn ? <div>
        <button onClick={humanReveal}>公開する</button>
        <button className="ghost" disabled={view.players[viewer].tokens <= 0 || view.row.length < 1} onClick={humanMove}>移動（🪙-1）</button>
        <div className="sub">おしりカードをタップで場に伏せて出す</div>
      </div> : <div className="sub">{cpuFlags[me] ? names[me] + "（CPU）の手番…🤖" : names[me] + "の手番"}</div>}
    </div>

    {reveal && <RevealModal reveal={reveal} names={names} cpuFlags={cpuFlags} onClose={() => setReveal(null)} />}
    {declaring && <DeclareFlow state={declaring.declState} names={names} cpuFlags={cpuFlags}
      difficulty={cfg.difficulty} onDone={declaring.onDone} />}
    {specialing && <SpecialFlow state={specialing.state} revealer={specialing.revealer}
      specials={specialing.specials} names={names} onDone={specialing.onDone} />}

    <div className="panel">
      <div style={{ cursor: "pointer", fontSize: 13 }} onClick={() => setLogOpen(!logOpen)}>
        📜 アクション履歴 {logOpen ? "▼" : "▶"}（{view.history.length}）
      </div>
      {logOpen && <div className="log">
        {view.history.slice().reverse().map((h, i) => <div key={i}>{histText(h, names, cpuFlags)}</div>)}
      </div>}
    </div>
  </div>;
}

function RevealModal({ reveal, names, cpuFlags, onClose }) {
  const r = reveal.result;
  const cards = reveal.rowCards || reveal.row.map((v) => ({ v: v, placedBy: 0 }));
  return <div className="modal"><div className="sheet">
    <div className="center"><b>公開！</b> {reveal.forced ? "（12枚で強制公開）" : ""}</div>
    <div className="row-cards center" style={{ justifyContent: "center", margin: "8px 0" }}>
      {cards.map((c, i) => {
        const col = PCOLORS[c.placedBy % PCOLORS.length];
        return <div key={i} className={"card rc" + (r && i < r.n ? " hl" : "")} style={{ borderColor: col }}>
          <span className="ob" style={{ background: col }}>{ownerBadge(c.placedBy, names, cpuFlags)}</span>
          <span className="rcv">{c.v}</span>
        </div>;
      })}
    </div>
    <div className="sub center">枠色＝配置者（誰が置いたか）</div>
    {r && <div className="breakdown center">
      {r.wangeki ? <div className="big win">ワン撃！🐕‼ 即勝利</div> : <div>
        連番 n={r.n} / 基礎点 {r.base} / 重複ペナ -{r.penalty}<br />
        <b>{names[reveal.revealer]} に {r.total}点</b>
      </div>}
      {reveal.wans.map((w, i) => <div key={i}>{names[w.player]} ワン！{w.delta > 0 ? "+" : ""}{w.delta}</div>)}
    </div>}
    <div className="center"><button onClick={onClose}>次へ</button></div>
  </div></div>;
}

function RulesShort() {
  return <div className="panel" style={{ fontSize: 12, lineHeight: 1.6 }}>
    <b>ルール要約</b><br />
    手番: おしりカードを裏向きで場に出す / 公開して得点 / 場札を移動（🪙）。<br />
    公開: 左端から1,2,3…と連番が続く長さnで基礎点 n(n+1)/2。重複は減点。<br />
    1〜12を特殊カードなしで揃えたら<b>ワン撃</b>で即勝利。累計150点でも勝ち。<br />
    特殊: 甘えん坊(欠け1つ補完)/やんちゃ(欠け無視・その分減点)/お昼寝(重複ペナ無効)。
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Babel を classic runtime で明示 transform（automatic runtimeのimport注入を回避）
  (function () {
    function boot() {
      try {
        var src = document.getElementById("appsrc").textContent;
        var out = Babel.transform(src, {
          presets: [["react", { runtime: "classic" }]],
        }).code;
        (0, eval)(out);
      } catch (e) {
        var pre = document.createElement("pre");
        pre.style.cssText = "color:#e56b6b;padding:16px;white-space:pre-wrap";
        pre.textContent = "起動エラー: " + (e && e.message ? e.message : e);
        var root = document.getElementById("root");
        root.textContent = "";
        root.appendChild(pre);
        throw e;
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
</script>
</body>
</html>
